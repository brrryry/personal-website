<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bryan Chan{% endblock %}</title>

    {% block meta %}
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <meta name="description" content="A typical computer science portfolio!">
    {% endblock %}

    <!-- Inline theme script to prevent flash of unstyled theme -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Vibe coded style sheet -->
    <link rel="stylesheet" href="/static/styles.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    {% block head %}{% endblock %}
</head>

<body
    class="items-center mx-auto bg-[#f8f8ff] text-[#1e1e1e] dark:bg-[#1e1e1e] dark:text-[#f8f8ff] font-['Open_Sans',sans-serif]">
    <main class="min-h-screen px-4 md:px-8">
        <!-- Navigation Menu -->
        <nav class="navbar">
            <a href="/" class="navbar-logo">
                Bryan Chan
            </a>

            <div class="navbar-right">
                <!-- Hamburger button — mobile only -->
                <button class="navbar-hamburger" id="nav-hamburger" aria-label="Open navigation menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>

                <ul class="navbar-links" id="nav-links">
                    <li>
                        <a href="/" class="navbar-link">Home</a>
                    </li>
                    <li>
                        <a href="/about" class="navbar-link">About</a>
                    </li>
                    <li>
                        <a href="/blog" class="navbar-link">Blog</a>
                    </li>
                </ul>

                <!-- Theme Toggle Button -->
                <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle Theme">
                    <!-- Sun Icon (visible in light mode) -->
                    <svg id="theme-sun-icon" xmlns="http://www.w3.org/2000/svg" class="icon-svg text-purple-700 hidden"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <!-- Moon Icon (visible in dark mode) -->
                    <svg id="theme-moon-icon" xmlns="http://www.w3.org/2000/svg" class="icon-svg text-purple-300 hidden"
                        fill="currentColor" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                    </svg>
                </button>
            </div>
        </nav>
        <script>
            // Hamburger toggle
            const hamburger = document.getElementById('nav-hamburger');
            const navLinks = document.getElementById('nav-links');
            hamburger && hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                navLinks.classList.toggle('open');
            });
            // Close when clicking outside
            document.addEventListener('click', () => {
                navLinks && navLinks.classList.remove('open');
            });
        </script>


        <!-- Main Content -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <!-- Footer -->
        <footer class="bg-transparent text-purple-200 p-4 flex flex-col items-center justify-center mt-12 pb-8">
            <hr class="w-full md:w-3/4 border-t border-white/3 my-4" />

            <!-- Spotify Player Status Widget -->
            <div id="spotify-widget" class="text-[#1e1e1e] dark:text-[#f8f8ff] mb-4 text-center">
                <div class="h-6 w-48 animate-pulse rounded-md bg-gray-200 dark:bg-gray-700 inline-block"></div>
            </div>

            <!-- Social Links -->
            <div class="flex items-center gap-4">
                <a href="mailto:thisisbryanchan@gmail.com" class="social-link"
                    aria-label="email: thisisbryanchan@gmail.com">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        class="icon-svg" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

                        <path d="M21 6.75a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6.75v.75l9 6 9-6v-.75z" />
                    </svg>
                </a>

                <a class="social-link" aria-label="Discord: @brrryry" title="discord: @brrryry">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="icon-svg">
                        <path
                            d="M13.545 2.907a13.2 13.2 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.2 12.2 0 0 0-3.658 0 8 8 0 0 0-.412-.833.05.05 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.04.04 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032q.003.022.021.037a13.3 13.3 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019q.463-.63.818-1.329a.05.05 0 0 0-.01-.059l-.018-.011a9 9 0 0 1-1.248-.595.05.05 0 0 1-.02-.066l.015-.019q.127-.095.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.05.05 0 0 1 .053.007q.121.1.248.195a.05.05 0 0 1-.004.085 8 8 0 0 1-1.249.594.05.05 0 0 0-.03.03.05.05 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.2 13.2 0 0 0 4.001-2.02.05.05 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.03.03 0 0 0-.02-.019m-8.198 7.307c-.789 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612m5.316 0c-.788 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612" />

                <a href="https://github.com/brrryry" target="_blank" rel="noopener noreferrer" class="social-link"
                    aria-label="github profile">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" class="icon-svg">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8" />
                    </svg>
                </a>
            </div>

            <!-- get git hash and link to it -->
            <div id="commit-hash">
                latest commit: <a href="https://github.com/brrryry/personal-website/commit/{{ commit_hash }}" target="_blank" rel="noopener noreferrer">{{ commit_hash_short }}</a>
            </div>

            <!-- technology links -->
            <div id="tech-links" class="mt-4">
                <a href="https://docs.rs/tera/latest/tera/index.html" target='_blank'>Tera</a> |
                <a href="https://www.docker.com/" target='_blank'>Docker</a> |
                <a href="https://ai.ugreen.com/" target='_blank'>UGreen NAS</a>
            </div>


            <div class="mt-4 text-xs text-purple-800 dark:text-purple-400 copyright">
                &copy; 2026 Bryan Chan. All rights reserved.
            </div>
        </footer>
    </main>

    <!-- Theme & UI Scripts -->
    <script>
        // Update theme toggle icons on load and state change
        function updateThemeToggleIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const sunIcon = document.getElementById('theme-sun-icon');
            const moonIcon = document.getElementById('theme-moon-icon');
            if (isDark) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }
        updateThemeToggleIcon();

        // Theme Toggle Click Handler
        const themeBtn = document.getElementById('theme-toggle-btn');
        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeToggleIcon();
            });
        }


    </script>

    <!-- Spotify Dynamic Fetcher Script -->
    <script>
        async function fetchSpotifySong() {
            const container = document.getElementById('spotify-widget');
            if (!container) return;
            try {
                const res = await fetch('/api/current-spotify');
                if (res.ok) {
                    const data = await res.json();
                    if (data.isPlaying) {
                        container.innerHTML = `Listening to: <a href="${data.songUrl}" target="_blank" rel="noreferrer" class="underline">${data.title} (${data.artist})</a> on Spotify!`;
                    } else {
                        container.innerHTML = 'Not listening to music right now!';
                    }
                } else {
                    container.innerHTML = 'Not listening to music right now!';
                }
            } catch (e) {
                container.innerHTML = 'Not listening to music right now!';
            }
        }
        fetchSpotifySong();
        setInterval(fetchSpotifySong, 10000); // 10s poll
    </script>
</body>

</html>
